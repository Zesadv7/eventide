<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Eventide · 持续工作的 Workspace">
  <title>Eventide · 工作空间</title>
  <link rel="stylesheet" href="/assets/style.css?v=6">
</head>
<body>
  <div class="app-shell">
    <aside id="navigation" class="navigation" aria-label="工作导航">
      <div class="nav-brand"><a href="/" aria-label="Eventide">EVENTIDE<span>Agent</span></a><button id="close-nav" class="icon-button" aria-label="收起导航" type="button">‹</button></div>
      <label class="workspace-label" for="workspace-switcher">工作区</label>
      <select id="workspace-switcher" aria-label="切换 Workspace"></select>
      <p id="workspace-path" class="workspace-path"></p>
      <p id="workspace-git" class="workspace-git"></p>
      <button id="new-session" class="new-work" type="button">＋ 新建工作</button>
      <div class="nav-heading">工作记录</div>
      <div id="session-list" class="session-list"></div>
      <div class="nav-footer">工作与历史保存在本机</div>
    </aside>
    <main class="work-area">
      <header class="topbar">
        <button id="open-nav" class="icon-button" type="button" aria-label="展开导航" aria-controls="navigation" aria-expanded="true">☰</button>
        <span id="workspace-name">工作空间</span><span class="breadcrumb-divider">/</span><span>工作记录</span>
        <button id="model-config-button" class="settings-button" type="button">设置 <span id="model-state"></span></button>
      </header>
      <div id="work-scroll" class="work-scroll">
        <div class="document">
          <header class="work-heading"><h1 id="session-title">从一项工作开始</h1><p id="session-status" class="session-status" role="status"></p></header>
          <p id="notice" class="notice" role="status" hidden></p>
          <section id="approvals" aria-label="待审批操作"></section>
          <section id="outcome" class="outcome" aria-label="已有成果"></section>
          <section class="history-section"><div class="section-heading"><h2>工作经过</h2><button id="session-details" type="button" class="text-button">查看详情</button></div><button id="load-older" type="button" class="text-button" hidden>加载更早记录</button><div id="narrative"></div></section>
        </div>
      </div>
      <footer class="action-area">
        <div class="action-inner">
          <div id="recovery" hidden><strong>工作已停驻</strong><p>Continue 将核验工作区与历史操作结果；若无法恢复，可以保留历史并放弃本次恢复。</p><div class="recovery-actions"><button id="continue-button" class="primary-button" type="button">尝试 Continue</button><button id="abandon-button" class="secondary-button" type="button">放弃恢复</button><button id="interruption-details" class="text-button" type="button">查看中断详情</button></div></div>
          <form id="prompt-form" class="composer"><label for="prompt">下一步工作</label><div class="composer-row"><textarea id="prompt" rows="2" placeholder="描述希望完成的工作…" required></textarea><button id="cancel-run" class="secondary-button" type="button" hidden>停止</button><button id="run-button" class="primary-button" type="submit">开始</button></div><div class="composer-foot"><span id="composer-hint">Ctrl + Enter 提交</span></div></form>
          <p id="action-message" class="action-message" role="status" hidden></p>
        </div>
      </footer>
    </main>
  </div>
  <dialog id="inspector" class="inspector" aria-labelledby="inspector-title"><header class="inspector-header"><h2 id="inspector-title">工作详情</h2><button id="close-inspector" class="icon-button" type="button" aria-label="关闭详情">×</button></header><div id="inspector-content"></div></dialog>
  <dialog id="model-dialog" class="model-dialog">
    <form id="model-form" class="model-form">
      <div class="dialog-heading">
        <div><p class="section-kicker">MODEL CONNECTION</p><h2>配置大模型</h2></div>
        <button id="close-model-dialog" class="icon-button" type="button" aria-label="关闭模型配置">×</button>
      </div>
      <p class="dialog-note">模型配置由这个 Eventide 服务的所有工作区共用。密钥在本机加密保存，不会回显。</p>
      <div class="config-grid">
        <label>Provider
          <select id="provider" name="provider">
            <option value="openai_responses">OpenAI Responses API</option>
            <option value="openai_compatible">OpenAI-compatible Chat Completions</option>
            <option value="anthropic">Anthropic Messages API</option>
          </select>
        </label>
        <label>Model
          <input id="model" name="model" autocomplete="off" required>
        </label>
        <label class="wide">Base URL
          <input id="base-url" name="base_url" type="text" inputmode="url" autocomplete="url" spellcheck="false">
        </label>
        <label class="wide">API Key
          <span class="secret-field"><input id="api-key" name="api_key" type="password" autocomplete="new-password" placeholder="留空保留已有密钥"><button id="toggle-key" type="button">显示</button></span>
          <small id="key-hint" class="field-hint">尚未保存 API Key</small>
        </label>
      </div>
      <div id="connection-result" class="connection-result" hidden></div>
      <div id="config-message" class="config-message" role="status"></div>
      <div class="dialog-actions">
        <button id="clear-api-key" class="text-button" type="button">清除密钥</button>
        <button id="reset-model-config" class="text-button" type="button">恢复启动配置</button>
        <span class="action-spacer"></span>
        <button id="test-model-config" class="secondary-button" type="button">检查连接</button>
        <button id="save-model-config" class="primary-button" type="submit">保存并应用</button>
      </div>
    </form>
  </dialog>

  <script type="module" src="/assets/app.js?v=6"></script>
</body>
</html>
