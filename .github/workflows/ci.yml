name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - run: uv sync --locked --extra dev
      - run: uv run python -m eventide --help
      - run: uv run python tests/check_service.py
      - run: uv run pytest -q
      - run: uv run python -m tests.check_offline_evaluations evals/smoke.yaml

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.14"
          enable-cache: true
      - run: uv sync --locked --extra dev
      - run: uv run pytest --cov=eventide --cov-fail-under=85
      - run: uv run ruff check eventide tests examples
      - run: uv run mypy eventide

  optional-extensions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true
      # Local model inference is a separate opt-in check with explicitly prepared models.
      - run: uv sync --locked --extra dev --extra code --extra telemetry
      - run: uv run --extra dev --extra code --extra telemetry pytest -q tests/test_code_structure.py tests/test_telemetry.py tests/test_delivery_runtime.py tests/test_delivery_lifecycle.py
      - run: uv run --extra dev --extra code --extra telemetry python -m tests.check_offline_evaluations evals/engineering.yaml

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --locked --extra dev
      - run: docker info
      - run: docker pull python:3.12-slim
      - run: uv run pytest -q tests/test_container_executor.py tests/test_container_live.py
        env:
          EVENTIDE_TEST_CONTAINER_IMAGE: python:3.12-slim
      - run: docker build -t eventide:validation .
      - run: uv run python tests/container_smoke.py --image eventide:validation

  vue:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --locked --extra dev
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: frontend
      - run: uv run --project .. npm run api:generate
        working-directory: frontend
      - run: npm run format:check && npm run typecheck && npm test && npm run build
        working-directory: frontend
      - run: git diff --exit-code -- frontend/openapi.json frontend/src/api/schema.d.ts eventide/workbench
      - run: npx playwright install chromium --only-shell --with-deps
        working-directory: frontend
      - run: npm run test:e2e
        working-directory: frontend
        env:
          EVENTIDE_PYTHON: ${{ github.workspace }}/.venv/bin/python
          EVENTIDE_E2E_BUILT: "1"
      - run: uv build --wheel --out-dir .task_outputs/dist
      - run: uv run python frontend/scripts/check_wheel.py .task_outputs/dist/eventide-0.5.0-py3-none-any.whl
      - run: uv run pytest -q tests/test_bundled_evaluations.py::test_installed_wheel_contains_all_resources_and_loads_without_checkout
        env:
          EVENTIDE_TEST_EVAL_WHEEL: ${{ github.workspace }}/.task_outputs/dist/eventide-0.5.0-py3-none-any.whl
