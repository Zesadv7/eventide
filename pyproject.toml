[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nexus-agent"
version = "0.2.0"
description = "A traceable, policy-aware runtime for tool-using AI agents."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "anthropic>=0.40,<2",
    "fastapi>=0.115,<1",
    "mcp>=1.10,<3",
    "openai>=1.60,<3",
    "python-dotenv>=1.0,<2",
    "pyyaml>=6.0,<7",
    "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27,<1",
    "mypy>=1.11,<2",
    "pytest>=8.0,<9",
    "pytest-asyncio>=0.24,<2",
    "pytest-cov>=5,<7",
    "ruff>=0.8,<1",
]

[project.scripts]
nexus-agent = "nexus_agent.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["nexus_agent*"]

[tool.setuptools.package-data]
nexus_agent = ["web/*.html", "web/*.css", "web/*.js"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
cache_dir = ".task_outputs/pytest-cache"

[tool.coverage.run]
source = ["nexus_agent"]
# The v0.1 teaching harness remains for source compatibility; the 85% gate
# measures the v0.2 runtime and its actively supported integration surfaces.
omit = [
    "nexus_agent/agent.py",
    "nexus_agent/context.py",
    "nexus_agent/hooks.py",
    "nexus_agent/memory/*",
    "nexus_agent/scheduling/cron.py",
    "nexus_agent/teams/teammate.py",
    "nexus_agent/teams/subagent.py",
    "nexus_agent/tools/built_ins.py",
    "nexus_agent/tools/dispatch.py",
    "nexus_agent/tools/registry.py",
    "nexus_agent/utils.py",
]

[tool.coverage.report]
fail_under = 85
show_missing = true

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.10"
warn_unused_ignores = true
disallow_untyped_defs = true
ignore_missing_imports = true
disable_error_code = ["import-untyped"]

[[tool.mypy.overrides]]
module = [
    "nexus_agent.agent",
    "nexus_agent.context",
    "nexus_agent.hooks",
    "nexus_agent.llm",
    "nexus_agent.memory.*",
    "nexus_agent.scheduling.*",
    "nexus_agent.tasks.*",
    "nexus_agent.teams.*",
    "nexus_agent.tools.*",
    "nexus_agent.utils",
]
ignore_errors = true
