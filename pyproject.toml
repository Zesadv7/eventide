[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "eventide"
version = "0.4.0"
description = "A traceable, policy-aware runtime for tool-using AI agents."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "anthropic>=0.40,<2",
    "cryptography>=43,<51",
    "fastapi>=0.115,<1",
    "httpx>=0.27,<1",
    "httpx2>=2.12,<3",
    "jsonschema>=4.23,<5",
    "mcp>=2.1.1,<3",
    "openai>=1.60,<3",
    "pydantic>=2.10,<3",
    "python-dotenv>=1.0,<2",
    "referencing>=0.35,<1",
    "pyyaml>=6.0,<7",
    "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
retrieval = [
    "sentence-transformers==6.1.0",
]
code = [
    "tree-sitter>=0.25,<0.27",
    "tree-sitter-python>=0.25,<0.26",
    "tree-sitter-javascript>=0.25,<0.26",
    "tree-sitter-typescript>=0.23.2,<0.24",
]
telemetry = [
    "opentelemetry-sdk>=1.30,<2",
    "opentelemetry-exporter-otlp-proto-http>=1.30,<2",
]
dev = [
    "mypy>=1.11,<2",
    "pytest>=8.0,<9",
    "pytest-asyncio>=0.24,<2",
    "pytest-cov>=5,<7",
    "ruff>=0.8,<1",
]

[project.scripts]
eventide-server = "eventide.server:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["eventide*"]
namespaces = false

[tool.setuptools.package-data]
eventide = ["workbench/*.html", "workbench/*.json", "workbench/assets/*", "bundled_skills/*/SKILL.md", "bundled_skills/*/references/*.md", "bundled_evals/*/manifest.yaml", "bundled_evals/*/dataset.json", "bundled_evals/*/fixtures/benchmark/*.json"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
cache_dir = ".task_outputs/pytest-cache"

[tool.coverage.run]
source = ["eventide"]

[tool.coverage.report]
fail_under = 85
show_missing = true

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.10"
warn_unused_ignores = true
disallow_untyped_defs = true
ignore_missing_imports = true
disable_error_code = ["import-untyped"]
