<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Nexus Agent Workspace 工作台">
  <title>Nexus Agent · Workspace</title>
  <link rel="stylesheet" href="/assets/style.css?v=5">
</head>
<body>
  <header class="workspace-bar">
    <a class="brand" href="/" aria-label="Nexus Agent Workspace">
      <span class="brand-mark">N</span>
      <span class="brand-copy"><strong>NEXUS Agent</strong><small>Workspace</small></span>
    </a>

    <div class="workspace-context" aria-label="当前 Workspace">
      <span class="context-label">Workspace</span>
      <strong id="current-workspace-name">未选择</strong>
      <span id="current-workspace-git" class="workspace-git">—</span>
      <select id="workspace-switcher" aria-label="切换 Workspace"></select>
    </div>

    <div class="bar-actions">
      <button id="new-session" class="quiet-button" type="button">New session</button>
      <button id="model-config-button" class="quiet-button" type="button">
        <span>Model</span><strong id="model-state">Checking</strong>
      </button>
      <span class="service-state"><span id="health-dot" class="status-dot"></span><span id="health">Connecting</span></span>
    </div>
  </header>

  <main class="app-shell">
    <aside class="session-nav" aria-label="Session 导航">
      <div class="nav-heading">
        <span>Sessions</span>
        <button id="mobile-close-nav" class="icon-button mobile-only" type="button" aria-label="关闭 Session 导航">×</button>
      </div>
      <div id="session-list" class="session-list">
        <p class="nav-empty">正在加载 Session…</p>
      </div>
    </aside>

    <section class="narrative-column">
      <header class="session-header">
        <button id="mobile-open-nav" class="icon-button mobile-only" type="button" aria-label="打开 Session 导航">☰</button>
        <div class="session-heading-copy">
          <p class="section-kicker">WORK NARRATIVE</p>
          <h1 id="session-title">选择一个 Session</h1>
          <p id="session-meta" class="session-meta">Session 的工作过程会在这里持续展开。</p>
        </div>
        <span id="session-status" class="session-status">Idle</span>
      </header>

      <div id="narrative" class="narrative" aria-live="polite">
        <div class="narrative-empty">
          <span class="empty-line"></span>
          <p>选择一个 Session，或创建新的工作上下文。</p>
        </div>
      </div>

      <form id="prompt-form" class="composer">
        <label for="prompt">继续这个工作上下文</label>
        <div class="composer-row">
          <textarea id="prompt" rows="2" placeholder="描述下一步要完成的工作…" required></textarea>
          <button id="run-button" class="send-button" type="submit" aria-label="运行任务">↗</button>
        </div>
        <div class="composer-foot"><span>Ctrl + Enter 运行</span><span id="composer-hint">选择 Session 后可开始</span></div>
      </form>
    </section>

    <aside id="inspector" class="inspector" aria-hidden="true">
      <div class="inspector-header">
        <div><p class="section-kicker">DETAIL INSPECTOR</p><h2 id="inspector-title">Details</h2></div>
        <button id="close-inspector" class="icon-button" type="button" aria-label="关闭详情">×</button>
      </div>
      <div id="inspector-content" class="inspector-content"></div>
    </aside>
  </main>

  <dialog id="model-dialog" class="model-dialog">
    <form id="model-form" class="model-form">
      <div class="dialog-heading">
        <div><p class="section-kicker">MODEL CONNECTION</p><h2>配置大模型</h2></div>
        <button id="close-model-dialog" class="icon-button" type="button" aria-label="关闭模型配置">×</button>
      </div>
      <p class="dialog-note">密钥会加密保存到本机 SQLite，不会回显到页面或接口响应。</p>
      <div class="config-grid">
        <label>Provider
          <select id="provider" name="provider">
            <option value="openai_responses">OpenAI Responses API</option>
            <option value="openai_compatible">OpenAI-compatible Chat Completions</option>
            <option value="anthropic">Anthropic Messages API</option>
          </select>
        </label>
        <label>Model
          <input id="model" name="model" autocomplete="off" required>
        </label>
        <label class="wide">Base URL
          <input id="base-url" name="base_url" type="url" autocomplete="url">
        </label>
        <label class="wide">API Key
          <span class="secret-field"><input id="api-key" name="api_key" type="password" autocomplete="new-password"><button id="toggle-key" type="button">Show</button></span>
          <small id="key-hint" class="field-hint">尚未保存 API Key</small>
        </label>
      </div>
      <div id="connection-result" class="connection-result" hidden></div>
      <div id="config-message" class="config-message" role="status"></div>
      <div class="dialog-actions">
        <button id="clear-api-key" class="text-button" type="button">清除密钥</button>
        <button id="reset-model-config" class="text-button" type="button">恢复启动配置</button>
        <span class="action-spacer"></span>
        <button id="test-model-config" class="secondary-button" type="button">检查连接</button>
        <button id="save-model-config" class="primary-button" type="submit">保存并应用</button>
      </div>
    </form>
  </dialog>

  <script src="/assets/app.js?v=5" defer></script>
</body>
</html>
